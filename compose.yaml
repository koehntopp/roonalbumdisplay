services:
  roon-display:
    image: roonalbumdisplay:latest
    restart: unless-stopped
    environment:
      # Direct connection, skipping LAN multicast discovery (which doesn't
      # cross into Docker's default bridge network) - see AGENTS.md.
      ROON_HOST: "192.168.1.100"
      ROON_PORT: "9330"
      PANEL_URL: "http://192.168.1.172"
      # ZONE: "Living Room"   # optional - default follows whichever zone plays
    volumes:
      # From a local `uv run roon_client/pair.py` run - deploy.sh copies
      # them here alongside this file, not baked into the image.
      - ./roon_core_id.txt:/app/roon_core_id.txt:ro
      - ./roon_token.txt:/app/roon_token.txt:ro
